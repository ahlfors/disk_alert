name: Build disk_alert

on:
  push:
    branches: [ main, master ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ═══════════════════════════════════════════════════
  # Job 1: 多架构静态编译
  # ═══════════════════════════════════════════════════
  build:
    name: Build [${{ matrix.arch }}]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch:   x86_64
            target: x86_64-linux-musl

          - arch:   aarch64
            target: aarch64-linux-musl

          - arch:   armv7l
            target: arm-linux-musleabihf

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 用官方 Action 安装 Zig，自动处理 PATH + 缓存 ──
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.13.0"

      # ── 静态交叉编译 ────────────────────────────────
      - name: Compile static binary
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          mkdir -p dist

          zig cc \
            -target ${{ matrix.target }} \
            -Os \
            -s \
            -static \
            -DVERSION=\"${VERSION}\" \
            -o dist/disk_alert_${{ matrix.arch }} \
            disk_alert.c

          ls -lh dist/disk_alert_${{ matrix.arch }}
          file dist/disk_alert_${{ matrix.arch }}

      # ── 冒烟测试（仅 x86_64 可在 runner 上直接执行） ──
      - name: Smoke test (x86_64 only)
        if: matrix.arch == 'x86_64'
        run: |
          ./dist/disk_alert_x86_64 \
            -t 0 -p / \
            -w "https://open.feishu.cn/open-apis/bot/v2/hook/smoke-test" \
            || true
          echo "✓ binary executed without crash"

      # ── 上传 Artifact ───────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: disk_alert_${{ matrix.arch }}
          path: dist/disk_alert_${{ matrix.arch }}
          retention-days: 30

  # ═══════════════════════════════════════════════════
  # Job 2: 打包 & 发布 Release（仅 tag push 触发）
  # ═══════════════════════════════════════════════════
  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Package & checksum
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p release

          find dist/ -type f -name 'disk_alert_*' | while read f; do
            cp "$f" release/
            chmod +x "release/$(basename $f)"
          done

          for bin in release/disk_alert_*; do
            ARCH=$(basename "$bin" | sed 's/disk_alert_//')
            tar -czf "release/disk_alert_${VERSION}_linux_${ARCH}.tar.gz" \
              -C release "$(basename $bin)" \
              --transform "s|$(basename $bin)|disk_alert|"
          done

          (cd release && sha256sum disk_alert_*.tar.gz > SHA256SUMS)
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "disk_alert ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## disk_alert ${{ github.ref_name }}

            极致轻量的磁盘空间告警工具 → 飞书通知

            | 特性 | 说明 |
            |------|------|
            | 正常时 | 仅 `statfs()` 系统调用，**零 fork、零网络** |
            | 告警时 | 仅一次 fork（openssl TLS）+ 一次 HTTPS 请求 |
            | 二进制 | musl 静态编译，**~30KB**，零运行时依赖 |

            ### 快速部署

            ```bash
            # 下载安装（以 x86_64 为例）
            curl -fsSL \
              https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/disk_alert_${{ github.ref_name }}_linux_x86_64.tar.gz \
              | sudo tar -xz -C /usr/local/bin/

            # systemd timer（每 10 分钟检测）
            sudo tee /etc/systemd/system/disk-alert.service << 'EOF'
            [Unit]
            Description=Disk space alert to Feishu
            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/disk_alert -t 85 -p / -w YOUR_WEBHOOK
            EOF

            sudo tee /etc/systemd/system/disk-alert.timer << 'EOF'
            [Unit]
            Description=Disk alert timer
            [Timer]
            OnBootSec=1min
            OnUnitActiveSec=10min
            [Install]
            WantedBy=timers.target
            EOF

            sudo systemctl daemon-reload && sudo systemctl enable --now disk-alert.timer
            ```

            ### 支持架构

            | 文件 | 架构 | 适用场景 |
            |------|------|---------|
            | `..._linux_x86_64.tar.gz`  | x86_64 | 常规服务器 / VPS |
            | `..._linux_aarch64.tar.gz` | arm64  | 树莓派 4、ARM 云服务器 |
            | `..._linux_armv7l.tar.gz`  | armv7  | 树莓派 2/3、嵌入式设备 |

            ### 校验完整性
            ```bash
            sha256sum -c SHA256SUMS
            ```
          files: |
            release/disk_alert_*.tar.gz
            release/SHA256SUMS
