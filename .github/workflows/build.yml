name: Build disk_alert

on:
  push:
    branches: [ main, master ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release:
        description: '是否创建 Release'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write

jobs:
  # ═══════════════════════════════════════════════════
  # Job 1: 多架构静态编译
  # ═══════════════════════════════════════════════════
  build:
    name: Build [${{ matrix.arch }}]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch:   x86_64
            target: x86_64-linux-musl
            cpu:    ""                   # generic，zig 自动处理

          - arch:   aarch64
            target: aarch64-linux-musl
            cpu:    ""

          - arch:   armv7l
            target: arm-linux-musleabihf
            cpu:    ""

          - arch:   s390x
            target: s390x-linux-musl
            cpu:    z15                  # ✅ z15 = Linux 支持的最低基准 CPU

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.13.0"

      - name: Compile static binary
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          mkdir -p dist

          # 有指定 cpu 才追加 -mcpu，其他架构不受影响
          CPU_FLAG=""
          if [ -n "${{ matrix.cpu }}" ]; then
            CPU_FLAG="-mcpu=${{ matrix.cpu }}"
          fi

          zig cc \
            -target ${{ matrix.target }} \
            $CPU_FLAG \
            -Os -s -static \
            -DVERSION=\"${VERSION}\" \
            -o dist/disk_alert_${{ matrix.arch }} \
            disk_alert.c

          ls -lh dist/disk_alert_${{ matrix.arch }}
          file dist/disk_alert_${{ matrix.arch }}

      - name: Smoke test (x86_64 only)
        if: matrix.arch == 'x86_64'
        run: |
          ./dist/disk_alert_x86_64 \
            -t 0 -p / \
            -w "https://open.feishu.cn/open-apis/bot/v2/hook/smoke-test" \
            || true
          echo "✓ binary executed without crash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: disk_alert_${{ matrix.arch }}
          path: dist/disk_alert_${{ matrix.arch }}
          retention-days: 30

  # ═══════════════════════════════════════════════════
  # Job 2: 打包 & 发布 Release
  # ═══════════════════════════════════════════════════
  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.release == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          fi
          echo "value=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Download artifact (x86_64)
        uses: actions/download-artifact@v4
        with:
          name: disk_alert_x86_64
          path: release/

      - name: Download artifact (aarch64)
        uses: actions/download-artifact@v4
        with:
          name: disk_alert_aarch64
          path: release/

      - name: Download artifact (armv7l)
        uses: actions/download-artifact@v4
        with:
          name: disk_alert_armv7l
          path: release/

      - name: Download artifact (s390x)
        uses: actions/download-artifact@v4
        with:
          name: disk_alert_s390x
          path: release/

      - name: Package & checksum
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          chmod +x release/disk_alert_*

          echo "=== Files in release/ ==="
          ls -lh release/

          for bin in release/disk_alert_*; do
            ARCH=$(basename "$bin" | sed 's/disk_alert_//')
            tar -czf "release/disk_alert_${VERSION}_linux_${ARCH}.tar.gz" \
              -C release "$(basename "$bin")" \
              --transform "s|$(basename "$bin")|disk_alert|"
          done

          (cd release && sha256sum disk_alert_*.tar.gz > SHA256SUMS)

          echo "=== Final release assets ==="
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: "disk_alert ${{ steps.version.outputs.value }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## disk_alert ${{ steps.version.outputs.value }}

            极致轻量的磁盘空间告警工具 → 飞书通知

            | 特性 | 说明 |
            |------|------|
            | 正常时 | 仅 `statfs()` 系统调用，**零 fork、零网络** |
            | 告警时 | 仅一次 fork（openssl TLS）+ 一次 HTTPS 请求 |
            | 二进制 | musl 静态编译，**~30KB**，零运行时依赖 |

            ### 快速部署

            ```bash
            curl -fsSL \
              https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.value }}/disk_alert_${{ steps.version.outputs.value }}_linux_x86_64.tar.gz \
              | sudo tar -xz -C /usr/local/bin/

            sudo tee /etc/systemd/system/disk-alert.service << 'EOF'
            [Unit]
            Description=Disk space alert to Feishu
            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/disk_alert -t 85 -p / -w YOUR_WEBHOOK
            EOF

            sudo tee /etc/systemd/system/disk-alert.timer << 'EOF'
            [Unit]
            Description=Disk alert timer
            [Timer]
            OnBootSec=1min
            OnUnitActiveSec=10min
            [Install]
            WantedBy=timers.target
            EOF

            sudo systemctl daemon-reload && sudo systemctl enable --now disk-alert.timer
            ```

            ### 支持架构

            | 文件 | 架构 | 适用场景 |
            |------|------|---------|
            | `..._linux_x86_64.tar.gz`  | x86_64 | 常规服务器 / VPS |
            | `..._linux_aarch64.tar.gz` | arm64  | 树莓派 4、ARM 云服务器 |
            | `..._linux_armv7l.tar.gz`  | armv7  | 树莓派 2/3、嵌入式设备 |
            | `..._linux_s390x.tar.gz`   | s390x  | IBM Z 大型机（z15+）|

            ### 校验完整性
            ```bash
            sha256sum -c SHA256SUMS
            ```
          files: |
            release/disk_alert_*.tar.gz
            release/SHA256SUMS
