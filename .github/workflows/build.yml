name: Build disk_alert

on:
  push:
    branches: [ main, master ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release:
        description: '是否创建 Release（仅在推送了 tag 时有效）'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write

jobs:
  build:
    name: Build [${{ matrix.arch }}]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch:   x86_64
            target: x86_64-linux-musl
          - arch:   aarch64
            target: aarch64-linux-musl
          - arch:   armv7l
            target: arm-linux-musleabihf

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.13.0"

      - name: Compile static binary
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          mkdir -p dist

          zig cc \
            -target ${{ matrix.target }} \
            -Os -s -static \
            -DVERSION=\"${VERSION}\" \
            -o dist/disk_alert_${{ matrix.arch }} \
            disk_alert.c

          ls -lh dist/disk_alert_${{ matrix.arch }}
          file dist/disk_alert_${{ matrix.arch }}

      - name: Smoke test (x86_64 only)
        if: matrix.arch == 'x86_64'
        run: |
          ./dist/disk_alert_x86_64 \
            -t 0 -p / \
            -w "https://open.feishu.cn/open-apis/bot/v2/hook/smoke-test" \
            || true
          echo "✓ binary executed without crash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: disk_alert_${{ matrix.arch }}
          path: dist/disk_alert_${{ matrix.arch }}
          retention-days: 30

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    # ✅ 修复：同时支持 tag push 和 workflow_dispatch 手动触发
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 验证当前 ref 是 tag，否则报错提示
      - name: Verify tag exists
        run: |
          if ! git describe --tags --exact-match HEAD 2>/dev/null; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "⚠️  当前 HEAD 不是一个 tag，Release 将使用 'dev' 作为版本号"
            fi
          fi

      - name: Download artifact (x86_64)
        uses: actions/download-artifact@v4
        with:
          name: disk_alert_x86_64
          path: release/

      - name: Download artifact (aarch64)
        uses: actions/download-artifact@v4
        with:
          name: disk_alert_aarch64
          path: release/

      - name: Download artifact (armv7l)
        uses: actions/download-artifact@v4
        with:
          name: disk_alert_armv7l
          path: release/

      - name: Package & checksum
        run: |
          # tag push 用 tag 名，手动触发用 git describe
          if startsWith(github.ref, 'refs/tags/'); then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          chmod +x release/disk_alert_*

          echo "=== Files in release/ ==="
          ls -lh release/

          for bin in release/disk_alert_*; do
            ARCH=$(basename "$bin" | sed 's/disk_alert_//')
            tar -czf "release/disk_alert_${VERSION}_linux_${ARCH}.tar.gz" \
              -C release "$(basename $bin)" \
              --transform "s|$(basename $bin)|disk_alert|"
          done

          (cd release && sha256sum disk_alert_*.tar.gz > SHA256SUMS)

          echo "=== Final release assets ==="
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "disk_alert ${{ env.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## disk_alert ${{ env.VERSION }}

            极致轻量的磁盘空间告警工具 → 飞书通知

            | 特性 | 说明 |
            |------|------|
            | 正常时 | 仅 `statfs()` 系统调用，**零 fork、零网络** |
            | 告警时 | 仅一次 fork（openssl TLS）+ 一次 HTTPS 请求 |
            | 二进制 | musl 静态编译，**~30KB**，零运行时依赖 |

            ### 快速部署

            ```bash
            curl -fsSL \
              https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/disk_alert_${{ env.VERSION }}_linux_x86_64.tar.gz \
              | sudo tar -xz -C /usr/local/bin/

            sudo tee /etc/systemd/system/disk-alert.service << 'EOF'
            [Unit]
            Description=Disk space alert to Feishu
            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/disk_alert -t 85 -p / -w YOUR_WEBHOOK
            EOF

            sudo tee /etc/systemd/system/disk-alert.timer << 'EOF'
            [Unit]
            Description=Disk alert timer
            [Timer]
            OnBootSec=1min
            OnUnitActiveSec=10min
            [Install]
            WantedBy=timers.target
            EOF

            sudo systemctl daemon-reload && sudo systemctl enable --now disk-alert.timer
            ```

            ### 支持架构
            | 文件 | 架构 | 适用场景 |
         _
